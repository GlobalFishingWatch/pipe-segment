services:
  gcloud:
    image: google/cloud-sdk:latest
    volumes:
      - "gcp:/root/.config/"
    entrypoint: gcloud

  dev: &dev
    image: gfw/pipe-segment-dev
    build:
      target: dev
    volumes:
      - ".:/opt/project"
      - "gcp:/root/.config/"
    entrypoint: /bin/bash

  dev_no_gcp:
    image: gfw/pipe-segment-dev
    # Dev container without GCP credentials.
    <<: *dev
    volumes:
      - ".:/opt/project"

  prod:
    image: gfw/pipe-segment-prod
    build:
      target: prod
    entrypoint: /bin/bash

  test:
    image: gfw/pipe-segment-test
    # Runs tests using the production Docker image.
    # Intended to be executed in the GitHub CI environment.
    environment:
      BIGQUERY_HOST: bigquery
      INTEGRATION_TESTS: true
    build:
      target: test
    entrypoint: "pytest -v"
    depends_on:
      - bigquery

  bigquery:
    platform: linux/x86_64
    ports:
      - 9050:9050
    image: ghcr.io/goccy/bigquery-emulator:latest
    command: --project=test_project --dataset=test_dataset

# Volume to hold GCP authentication
volumes:
  gcp:
    external: true
